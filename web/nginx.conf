# HR 助理 Web 前端 nginx 配置
# ----------------------------------------------------------------------------
# 职责：
#   1. 托管 Vite 构建产物（SPA，所有前端路由 fallback 到 index.html）
#   2. /api/ 反代到后端 FastAPI（compose 服务名 app:8000），前缀重写
#   3. SSE 流式支持：关缓冲、长读超时、 Connection 头透传
#   4. 静态资源缓存策略、gzip、基础安全响应头
# ----------------------------------------------------------------------------

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip：文本类资源压缩 ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;
    gzip_vary on;

    # ---- 基础安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 前端无内联脚本/样式以外的外部资源需求；connect-src 允许同源（/api 反代）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:" always;

    # ---- /api/ 反代到后端 FastAPI（compose 服务名 app，端口 8000）----
    # 与 dev proxy 口径一致：/api/chat/stream -> http://app:8000/chat/stream
    location /api/ {
        # 用变量 + resolver 让 nginx 在启动时不因 app 未就绪而失败（Docker 内嵌 DNS 127.0.0.11）
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_app http://app:8000;
        proxy_pass $upstream_app/;
        proxy_http_version 1.1;

        # SSE 关键配置：
        #   - 关代理缓冲，token 级事件立即下发（否则攒够 buffer 才 flush，流式变整段）
        #   - Connection 置空 + HTTP/1.1，避免逐跳头干扰长连接
        #   - 读超时拉长到 1 小时：审批挂起期间 SSE 连接可能长时间无数据
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 禁用 nginx 侧对响应的压缩缓冲干扰（gzip 对 text/event-stream 不生效，
        # 因 gzip_types 不含该类型，这里仅作显式声明）
        proxy_set_header Accept-Encoding "";

        # 标准反代头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 请求体大小：聊天请求很小，2m 足够且能挡异常大包
        client_max_body_size 2m;
    }

    # ---- 带内容指纹的构建产物（/assets/*.js|css，文件名含 hash）：长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # ---- SPA 路由 fallback：前端路由全部回到 index.html ----
    # index.html 不缓存，保证发版后立即生效
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
