# Alembic config: script location and DB connection.
# NOTE: keep this file ASCII-only -- alembic reads it with locale encoding
# (GBK on zh-CN Windows), non-ASCII comments will crash config parsing.
# The DB URL is NOT hardcoded here: alembic/env.py reads config.Settings
# (DATABASE_URL); override on CLI with -x dburl=...
[alembic]
script_location = alembic
prepend_sys_path = .
timezone = Asia/Shanghai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
