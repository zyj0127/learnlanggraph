# -*- coding: utf-8 -*-
# 企业 HR 智能助理 —— 项目元数据与依赖钉扎（唯一真源）
#
# 版本钉扎与 build_wheels/constraints.txt / Docker 构建同源：
# 「容器里跑的就是评测过的那套」。已知不兼容组合（如 langchain 1.4.0）
# 通过 == 钉扎规避，禁止改回无上限的 >=。
#
# 安装：
#   pip install -e .              # 核心运行依赖（API + Agent + RAG）
#   pip install -e .[models]      # 可选：模型管理/向量库持久化/图片（chromadb/pillow/modelscope）
#   pip install -e .[dev]         # 可选：测试工具
#
# requirements.txt 由本文件的 [project.dependencies] 同步生成（钉 == 版本），
# 供 Docker 构建与 constraints.txt 配合使用。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnlanggraph"
version = "2.0.0"
description = "基于 LangGraph + DeepSeek 的企业 HR 智能助理（RAG + 工具调用 + 人工审批 + 双层防幻觉）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain==1.3.12",
    "langchain-core==1.4.9",
    "langchain-openai==1.3.0",
    "langchain-huggingface==1.2.2",
    # 内存向量库（默认检索路径）依赖：Chroma 的 LangChain 适配层
    "langchain-chroma==1.1.0",
    # BM25Retriever 的可选依赖：langchain 不会自动装，缺了会在构建 BM25 检索器时 ImportError
    "rank_bm25==0.2.2",
    "langchain-classic==1.0.8",
    "langchain-community==0.4.2",
    "langgraph==1.2.8",
    "langgraph-checkpoint-sqlite==3.1.0",
    # 企业化第一阶段：PostgreSQL checkpointer（psycopg3 版 saver）
    "langgraph-checkpoint-postgres==3.1.0",
    # PostgreSQL / pgvector 数据栈
    "psycopg[binary]==3.2.3",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    # Langfuse 可观测性（未配置时静默降级）
    "langfuse==2.60.5",
    # OpenTelemetry 链路追踪（OTEL_EXPORTER_OTLP_ENDPOINT 未配置时静默降级）
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    # Prometheus 指标出口（/metrics；未安装时 observability/prom.py 静默降级）
    "prometheus-client==0.26.0",
    # 企业化第二阶段：JWT 认证（HS256；接企业 SSO 时切 RS256，见 auth/jwt_tokens.py）
    "PyJWT==2.10.1",
    "fastapi==0.137.1",
    "uvicorn==0.49.0",
    "mcp==1.28.1",
    "langchain-mcp-adapters==0.3.0",
    "sentence-transformers==5.6.0",
    "pydantic==2.13.4",
    # 统一 Settings 配置管理（config.py）
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "streamlit==1.58.0",
]

[project.optional-dependencies]
# 模型管理 / 向量库持久化 / 图片处理：核心链路（内存向量库）不依赖，
# 仅在 download_model.py、Chroma 持久化模式或测试绘图时需要。
models = [
    "chromadb==1.5.9",
    "pillow==12.2.0",
    "modelscope==1.37.1",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["config", "logging_config"]
packages = [
    "agent",
    "api",
    "auth",
    "database",
    "tools",
    "eval",
    "observability",
    "telemetry",
]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "needs_models: 需要 BGE 模型权重（CI_MODEL_TESTS=1 开启，否则跳过）",
    "needs_pg: 需要 PostgreSQL 实例（CI_PG_TESTS=1 开启，否则跳过）",
    "needs_llm: 需要真实 LLM API Key（CI_LLM_TESTS=1 开启，消耗 token）",
]
