# LiteLLM 网关配置模板：DeepSeek 主模型 + 备用模型 failover 示例
# 应用侧统一走 OpenAI 兼容协议：LLM_BASE_URL=http://localhost:4000
# 模型名对应用保持 "deepseek-chat" 不变——网关内部做路由与故障转移。

model_list:
  # 主：DeepSeek 官方
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      # rpm: 60   # 统一限流示例：按需打开，按模型粒度生效

  # 备用：同一模型的第二部署（示例为同一上游，实际可换其他供应商/代理）
  # 主部署失败时 LiteLLM 按 fallbacks 自动转移，应用侧无感知。
  - model_name: deepseek-chat-backup
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

router_settings:
  # 主模型报错（超时/429/5xx）时自动落到备用部署
  fallbacks:
    - deepseek-chat:
        - deepseek-chat-backup
  # 网关级统一限流示例（按 key 粒度，按需调整）
  # default_max_parallel_requests: 25
  # redis_host / redis_port      # 多实例限流需外接 Redis，第二阶段再引入

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # 失败日志不进 stdout 噪音，交给 Langfuse 侧观测
  success_callback: []
