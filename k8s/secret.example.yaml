# Secret 模板（示例值均为占位符，禁止提交真实密钥！）
#
# 使用方式（三选一）：
# 1. 手工：复制为 secret.yaml 填入真实值后 kubectl apply（secret.yaml 已建议加
#    .gitignore / 不入库）；
# 2. External Secrets Operator（推荐）：用 ExternalSecret CRD 从 Vault /
#    云厂商 KMS 同步到同名 Secret——对接点就是把本模板的每个 key 映射到
#    外部密钥库的 path，应用侧清单（envFrom secretRef）零改动；
# 3. sealed-secrets：用 kubeseal 加密后提交 SealedSecret，集群内控制器解密为
#    同名 Secret，清单同样零改动。
# 方案接入指引见 DEPLOY.md「7. Kubernetes 部署」章节。
apiVersion: v1
kind: Secret
metadata:
  name: hr-agent-secret
  namespace: hr-agent
type: Opaque
stringData:
  # PostgreSQL（与 postgres StatefulSet 的 POSTGRES_* 同源）
  POSTGRES_USER: hr
  POSTGRES_PASSWORD: "change_me"
  POSTGRES_DB: hr_agent
  DATABASE_URL: postgresql+psycopg://hr:change_me@postgres:5432/hr_agent
  # LLM 凭据（直连 DeepSeek 或网关 master key 二选一）
  DEEPSEEK_API_KEY: "sk-change_me"
  # LLM_API_KEY: "sk-litellm-change_me"
  # JWT 验签密钥（HS256；生产用强随机值，接 SSO 后切 RS256/JWKS）
  JWT_SECRET: "change_me_to_a_random_secret"
  # Langfuse（可选）
  # LANGFUSE_PUBLIC_KEY: "pk-lf-change_me"
  # LANGFUSE_SECRET_KEY: "sk-lf-change_me"
